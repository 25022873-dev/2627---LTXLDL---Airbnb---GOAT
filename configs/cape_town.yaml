city: cape_town
data_root: south-africa/wc/cape-town
currency: ZAR
snapshots: [2025-09-28, 2025-12-29, 2026-03-30, 2026-06-29]
group_code: DSE2049-C04-G04-cape-town
ids_file: data/Phân_công_thành_phố_cho_project_cuối_kỳ.xlsx
qa:
  iqr_k: 1.5
  expected:
    listings: 1000
    calendar: 365000
    reviews: 5000
    entire_home: 875
    private_room: 125
    zero_reviews: {2025-09-28: 50, 2025-12-29: 30, 2026-03-30: 25, 2026-06-29: 25}
    missing_price: {2026-06-29: 20}
    area_size: [120, 130]
llm:
  provider: gemini
  model: gemini-3.1-flash-lite
  api_key_env: GEMINI_API_KEY
  prompt_version: v1
  batch_size: 20
  rpm: 5
  retries: 5
  max_chars: 1000
  aspects: [location, cleanliness, host, value, amenities, noise, safety]
  price_in: 0.25
  price_out: 1.50
  price_date: "2026-11-07"
seed: 42
baseline:
  thr: 0.05          # ngưỡng mặc định của VADER, không chỉnh trên nhãn tay
  mixed_min: 0.4     # mệnh đề có |điểm| >= giá trị này mới tính là khen/chê rõ
  default: positive  # nhãn phổ biến nhất khi không có tín hiệu
  lang_min_chars: 20
  lang_min_prob: 0.7
  keywords:
    location: [location, located, area, neighbourhood, view, walk, close to, central]
    cleanliness: [clean, spotless, dirty, filthy, dust, smell, stain]
    host: [host, communicat, check-in, check in, responsive, welcom]
    value: [value, price, cost, expensive, cheap, worth, overpriced]
    amenities: [amenit, wifi, wi-fi, parking, bed, kitchen, shower, equipped, pool]
    noise: [noise, noisy, loud, quiet, peaceful, music]
    safety: [safe, safety, secure, unsafe, crime, dangerous, lock]
eval:
  labels: data/samples/hand_labels.csv   # cột: review_id, label
  bootstrap: 2000